<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD using jQuery</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      form {
        margin-bottom: 20px;
        padding: 15px;
        border: 1px solid #ccc;
        max-width: 400px;
        background-color: #f9f9f9;
      }
      .form-group {
        margin-bottom: 10px;
      }
      label {
        display: inline-block;
        width: 130px;
      }
      input[type="text"],
      input[type="number"] {
        padding: 5px;
        width: 200px;
      }
      button,
      input[type="submit"] {
        padding: 6px 12px;
        cursor: pointer;
      }
      table {
        width: 100%;
        max-width: 700px;
        border-collapse: collapse;
      }
      table,
      th,
      td {
        border: 1px solid #ddd;
      }
      th,
      td {
        padding: 8px;
        text-align: left;
      }
      th {
        background-color: #f2f2f2;
      }
      .btn-edit {
        background-color: #4caf50;
        color: white;
        border: none;
        margin-right: 5px;
      }
      .btn-delete {
        background-color: #f44336;
        color: white;
        border: none;
      }
    </style>
  </head>
  <body>
    <form id="studentForm">
      <input type="hidden" id="editRowIndex" value="" />
      <div class="form-group">
        <label for="firstname">First Name:</label>
        <input type="text" id="firstname" required />
      </div>
      <div class="form-group">
        <label for="lastname">Last Name:</label>
        <input type="text" id="lastname" required />
      </div>
      <div class="form-group">
        <label for="rollnumber">Roll Number:</label>
        <input type="number" id="rollnumber" required />
      </div>
      <div class="form-group">
        <label for="sem">Sem:</label>
        <input type="number" id="sem" required />
      </div>
      <button type="submit" id="saveBtn">Add Student</button>
      <button type="button" id="cancelBtn" style="display: none">Cancel</button>
    </form>

    <h2>Student Records</h2>
    <table id="studentTable">
      <thead>
        <tr>
          <th>Roll No</th>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Sem</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <!-- Dynamic rows will be inserted here -->
      </tbody>
    </table>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
      $(document).ready(function () {
        $("#studentForm").on("submit", function (e) {
          e.preventDefault();

          let firstName = $("#firstname").val().trim();
          let lastName = $("#lastname").val().trim();
          let rollNumber = $("#rollnumber").val().trim();
          let sem = $("#sem").val().trim();
          let editIndex = $("#editRowIndex").val();

          if (editIndex === "") {
            let newRow = `
              <tr>
                <td>${rollNumber}</td>
                <td>${firstName}</td>
                <td>${lastName}</td>
                <td>${sem}</td>
                <td>
                  <button class="btn-edit">Edit</button>
                  <button class="btn-delete">Delete</button>
                </td>
              </tr>
            `;
            $("#studentTable tbody").append(newRow);
          } else {
            // Update: Edit existing row
            let row = $("#studentTable tbody tr").eq(editIndex);
            row.find("td").eq(0).text(rollNumber);
            row.find("td").eq(1).text(firstName);
            row.find("td").eq(2).text(lastName);
            row.find("td").eq(3).text(sem);

            $("#editRowIndex").val("");
            $("#saveBtn").text("Add Student");
            $("#cancelBtn").hide();
          }

          $("#studentForm")[0].reset();
        });

        $("#studentTable").on("click", ".btn-edit", function () {
          let row = $(this).closest("tr");
          let rowIndex = row.index();

          let rollNumber = row.find("td").eq(0).text();
          let firstName = row.find("td").eq(1).text();
          let lastName = row.find("td").eq(2).text();
          let sem = row.find("td").eq(3).text();

          $("#firstname").val(firstName);
          $("#lastname").val(lastName);
          $("#rollnumber").val(rollNumber);
          $("#sem").val(sem);

          $("#editRowIndex").val(rowIndex);
          $("#saveBtn").text("Update Student");
          $("#cancelBtn").show();
        });

        $("#studentTable").on("click", ".btn-delete", function () {
          if (confirm("Are you sure you want to delete this record?")) {
            $(this).closest("tr").remove();

            // Clear form if the row being edited was deleted
            $("#studentForm")[0].reset();
            $("#editRowIndex").val("");
            $("#saveBtn").text("Add Student");
            $("#cancelBtn").hide();
          }
        });

        $("#cancelBtn").on("click", function () {
          $("#studentForm")[0].reset();
          $("#editRowIndex").val("");
          $("#saveBtn").text("Add Student");
          $(this).hide();
        });
      });
    </script>
  </body>
</html>
