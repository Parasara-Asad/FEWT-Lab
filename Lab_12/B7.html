<!doctype html>
<html>
  <head>
    <title>B7</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <div id="myDiv">
      <h2>Heading</h2>
      <p>This is a paragraph.</p>
      <input type="text" placeholder="Enter text" />
    </div>

    <br />

    <button id="btn">Change Background</button>

    <script>
      $("#btn").click(function () {
        $("#myDiv").children().css("background-color", "red");
      });
    </script>
  </body>
</html>
