<!doctype html>
<html>
  <head>
    <title>A9</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <h2 id="myEle">Hello World!</h2>

    <button id="btn">Hide Element</button>

    <script>
      $(document).ready(function () {
        $("#btn").click(function () {
          $("#myEle").hide();
        });
      });
    </script>
  </body>
</html>
