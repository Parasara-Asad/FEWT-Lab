  <body>
    Name: <input type="text" /><br /><br />
    Email: <input type="text" /><br /><br />

    <script>
      $("input").focus(function () {
        $(this).css("background-color", "blue");

      $("input").blur(function () {
        $(this).css("background-color", "white");
      });
    </script>
